[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "cloudsigma-heat-experimental-offline"
version = "0.0.1.dev0"
description = "Explicit experimental offline Heat integration; not operational provisioning"
requires-python = ">=3.12"
dependencies = ["openstack-heat==27.0.0", "cloudsigma==3.0.0rc1"]
[tool.setuptools.packages.find]
include = ["cloudsigma_heat*"]
